{
  ["oc-sas-lib"] = {
    files = {
      [":main/sas"] = "//lib/sas"
    },
    name = "OC-IEC61850-SAS Library",
    description = "Shared IEC 61850-inspired data model, MMS-lite/GOOSE-lite protocol over the built-in OpenComputers modem, select-before-operate state machine, historian and alarm engine used by oc-sas-ied and oc-sas-scada.",
    authors = "rsmith01008"
  },
  ["oc-sas-ied"] = {
    files = {
      ["main/rc.d/iedd.lua"] = "//etc/rc.d",
      ["main/etc/sas-ied.cfg.example"] = "//etc"
    },
    dependencies = {
        ["oc-sas-lib"] = "/lib"
    },
    name = "OC-IEC61850-SAS IED",
    description = "Generic, config-driven IEC 61850-style Intelligent Electronic Device: redstone breaker/switch control, Create: Electro-Energistics analog measurements, MMS-lite server + GOOSE-lite publisher.",
    authors = "rsmith01008",
    note = "cp /etc/sas-ied.cfg.example /etc/sas-ied.cfg, edit it, make sure this machine has a modem component, then: rc iedd enable; rc iedd start."
  },
  ["oc-sas-scada"] = {
    files = {
      ["main/rc.d/scadad.lua"] = "//etc/rc.d",
      ["main/usr/bin/sas-ctl.lua"] = "//bin",
      ["main/etc/sas-scada.cfg.example"] = "//etc"
    },
    dependencies = {
      ["oc-sas-lib"] = "//lib/sas"
      },
    name = "OC-IEC61850-SAS SCADA",
    description = "Station-bus data concentrator: MMS-lite/GOOSE-lite client to IEDs, live aggregate database, alarm evaluation, historian, MMS-lite server for HMI clients.",
    authors = "rsmith01008",
    note = "cp /etc/sas-scada.cfg.example /etc/sas-scada.cfg, edit it, make sure this machine has a modem component, then: rc scadad enable; rc scadad start."
  },
  ["oc-sas-hmi"] = {
    files = {
      ["main/usr/bin/sas-hmi.lua"] = "//bin",
      ["main/etc/sas-hmi.cfg.example"] = "//etc"
    },
    dependencies = { "oc-sas-lib" },
    name = "OC-IEC61850-SAS HMI",
    description = "Full-screen OpenOS terminal HMI: one-line switchyard diagram auto-derived from SCADA's compiled topology, select-before-operate control dialog, alarm panel. MMS-lite client of SCADA only, never talks to an IED directly.",
    authors = "rsmith01008",
    note = "cp /etc/sas-hmi.cfg.example /etc/sas-hmi.cfg, edit it (SCADA name, operator), make sure this machine has a modem component, then: sas-hmi"
  }
}
